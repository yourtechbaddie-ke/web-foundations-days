<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p class="tagline">Capture ideas before they disappear.</p>
    </header>

    <main>
      <section class="card">
        <h2>Add a note</h2>
        <form id="note-form">
          <label for="note-input">New note</label>
          <input
            type="text"
            id="note-input"
            maxlength="200"
            placeholder="What do you want to remember?"
            autocomplete="off"
          />
          <label for="note-category" class="visually-hidden">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2>Your notes</h2>
        <label for="search-input" class="visually-hidden">Search notes</label>
        <input type="search" id="search-input" placeholder="Search notes..." />
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
        <button type="button" id="clear-all" class="secondary-btn">Clear all</button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes &middot; Web Foundations Project 1</p>
    </footer>
  </body>
</html>
