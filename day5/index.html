<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load and filter users from a public API.</p>
    </header>

    <main>
      <section>
        <h2>Users</h2>
        <button id="load-users" type="button">Load users</button>

        <label for="filter-input">Filter users by name</label>
        <input
          id="filter-input"
          type="search"
          placeholder="Type a name..."
        />

        <p id="status"></p>
        <ul id="users-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 User Directory. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
